<text x="960" y="160" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2a24" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="960" dy="0">ESP32 DevKit</tspan></text>
<circle cx="908" cy="250" r="4" fill="#d4af37"/>
<text x="918" y="254" font-size="11" text-anchor="start" font-weight="700" fill="#e5f3ea" font-family="JetBrains Mono,Menlo,Consolas,monospace"><tspan x="918" dy="0">GND</tspan></text>
<circle cx="908" cy="270" r="4" fill="#d4af37"/>
<text x="918" y="274" font-size="11" text-anchor="start" font-weight="700" fill="#e5f3ea" font-family="JetBrains Mono,Menlo,Consolas,monospace"><tspan x="918" dy="0">D22</tspan></text>
<circle cx="908" cy="290" r="4" fill="#d4af37"/>
<text x="918" y="294" font-size="11" text-anchor="start" font-weight="700" fill="#e5f3ea" font-family="JetBrains Mono,Menlo,Consolas,monospace"><tspan x="918" dy="0">3V3</tspan></text>
<circle cx="908" cy="310" r="4" fill="#d4af37"/>
<text x="918" y="314" font-size="11" text-anchor="start" font-weight="700" fill="#e5f3ea" font-family="JetBrains Mono,Menlo,Consolas,monospace"><tspan x="918" dy="0">D21</tspan></text>
<path d="M797,250 L908,250" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
<text x="852" y="246" font-size="10" text-anchor="middle" font-weight="600" fill="#374151" font-family="JetBrains Mono,Menlo,Consolas,monospace"><tspan x="852" dy="0">1 GND</tspan></text>
<path d="M797,270 L908,270" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
<text x="852" y="266" font-size="10" text-anchor="middle" font-weight="600" fill="#374151" font-family="JetBrains Mono,Menlo,Consolas,monospace"><tspan x="852" dy="0">2 GPIO22</tspan></text>
<path d="M797,290 L908,290" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
<text x="852" y="286" font-size="10" text-anchor="middle" font-weight="600" fill="#374151" font-family="JetBrains Mono,Menlo,Consolas,monospace"><tspan x="852" dy="0">3 3V3</tspan></text>
<path d="M797,310 L908,310" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>
<text x="852" y="306" font-size="10" text-anchor="middle" font-weight="600" fill="#374151" font-family="JetBrains Mono,Menlo,Consolas,monospace"><tspan x="852" dy="0">4 GPIO21</tspan></text>
<rect x="944" y="410" width="32" height="18" rx="3" fill="#9aa3ad" stroke="#4b5563"/>
<path d="M960,428 L960,470" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
<rect x="878" y="470" width="156" height="40" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
<text x="956" y="494" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2a24" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="956" dy="0">5 V USB power supply</tspan></text>
<rect x="30" y="530" width="980" height="148" rx="10" fill="#f7f8fa" stroke="#d6dbe1"/>
<text x="50" y="556" font-size="13" text-anchor="start" font-weight="500" fill="#1f2a24" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="50" dy="0">1  Switch off the boiler (and its power).</tspan></text>
<text x="50" y="578" font-size="13" text-anchor="start" font-weight="500" fill="#1f2a24" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="50" dy="0">2  Remove the front panel, unlock and lower the electrical box.</tspan></text>
<text x="50" y="600" font-size="13" text-anchor="start" font-weight="500" fill="#1f2a24" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="50" dy="0">3  On Z1 (rightmost pair): disconnect the old relay wires or remove the jumper. Keep them for fallback.</tspan></text>
<text x="50" y="622" font-size="13" text-anchor="start" font-weight="500" fill="#1f2a24" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="50" dy="0">4  Connect adapter J1 to Z1. Polarity does not matter (bridge D1–D4).</tspan></text>
<text x="50" y="644" font-size="13" text-anchor="start" font-weight="500" fill="#1f2a24" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="50" dy="0">5  Connect J2 to the ESP32: 1 GND · 2 GPIO22 · 3 3V3 · 4 GPIO21.</tspan></text>
<text x="50" y="666" font-size="13" text-anchor="start" font-weight="500" fill="#1f2a24" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="50" dy="0">6  Power the ESP32 from USB, then switch the boiler on. Check info 22 = 4.</tspan></text>
<text x="30" y="704" font-size="11" text-anchor="start" font-weight="400" fill="#6b7280" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="30" dy="0">Own drawing based on the ILEA installer manual (fig. 21). Terminal order may differ on other revisions – check the labels on your boiler.</tspan></text>
</svg>