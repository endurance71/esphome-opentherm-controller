<text x="651" y="340" font-size="10.5" text-anchor="middle" font-weight="500" fill="#9a4a0b" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="651" dy="0">boiler side</tspan></text>
<text x="760" y="340" font-size="10.5" text-anchor="middle" font-weight="500" fill="#1e4f99" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="760" dy="0">ESP32 side</tspan></text>
<text x="706" y="368" font-size="10" text-anchor="middle" font-weight="500" fill="#6b7280" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"><tspan x="706" dy="0">isolation gap</tspan></text>
