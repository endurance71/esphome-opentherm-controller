# OpenTherm – konfiguracja DIAGNOSTYCZNA (pełny odczyt OpenTherm)
# Pierwszy test z nowym kotłem. Przygotowana pod ACV ILEA (boilers/acv-ilea/), działa z każdym kotłem OpenTherm.
# ESP32-WROOM + adapter OpenTherm: GPIO21 = RX (wejście), GPIO22 = TX (wyjście)
#
# Bezpieczne ustawienia na czas testu:
#  - Grzanie CO startuje WYŁĄCZONE (włączysz je ręcznie w Home Assistant)
#  - Grzanie CWU włączone (ciepła woda w kranie działa)
#  - Zapisywana jest tylko temperatura zasilania CO (domyślnie 40 °C);
#    temperatura CWU i max CO są tylko ODCZYTYWANE, nic ich nie nadpisuje.

substitutions:
  name: opentherm-boiler          # ta sama nazwa w konfiguracji docelowej → podmiana przez OTA
  friendly_name: Kocioł

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

logger:
  level: DEBUG          # w logach widać typ każdej odpowiedzi kotła

api:                  # sekrety: zobacz secrets.example.yaml
  encryption:
    key: !secret api_key
  reboot_timeout: 0s    # bez restartów, gdy HA nie odpowiada

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                   # hotspot awaryjny, gdy Wi-Fi nie działa (strona z wyborem sieci)
    ssid: "${name}"
    password: !secret ap_password

captive_portal:

opentherm:
  in_pin: GPIO21
  out_pin: GPIO22

# ---------- STEROWANIE ----------
switch:
  - platform: opentherm
    ch_enable:
      name: "Grzanie CO"
      restore_mode: ALWAYS_OFF
    dhw_enable:
      name: "Grzanie CWU"
      restore_mode: ALWAYS_ON

number:
  - platform: opentherm
    t_set:
      name: "Zadana temperatura zasilania CO"
      min_value: 20
      max_value: 60
      step: 0.5
      initial_value: 40
      restore_value: true

# ---------- ODCZYTY ----------
sensor:
  - platform: opentherm
    t_boiler:
      name: "Temperatura zasilania"
    t_ret:
      name: "Temperatura powrotu"
    t_dhw:
      name: "Temperatura CWU"
    t_outside:
      name: "Temperatura zewnętrzna (kocioł)"
    t_exhaust:
      name: "Temperatura spalin"
    t_flow_ch2:
      name: "Temperatura zasilania obieg 2"
    t_dhw2:
      name: "Temperatura CWU 2"
    t_storage:
      name: "Temperatura zasobnika solarnego"
    t_collector:
      name: "Temperatura kolektora solarnego"
    ch_pressure:
      name: "Ciśnienie instalacji"
    dhw_flow_rate:
      name: "Przepływ CWU"
    rel_mod_level:
      name: "Modulacja palnika"
    fan_speed:
      name: "Obroty wentylatora"
    fan_speed_setpoint:
      name: "Obroty wentylatora zadane"
    flame_current:
      name: "Prąd jonizacji"
    burner_starts:
      name: "Starty palnika"
    ch_pump_starts:
      name: "Starty pompy CO"
    dhw_pump_valve_starts:
      name: "Starty pompy lub zaworu CWU"
    dhw_burner_starts:
      name: "Starty palnika na CWU"
    burner_operation_hours:
      name: "Godziny pracy palnika"
    ch_pump_operation_hours:
      name: "Godziny pracy pompy CO"
    dhw_pump_valve_operation_hours:
      name: "Godziny pracy pompy lub zaworu CWU"
    dhw_burner_operation_hours:
      name: "Godziny pracy palnika na CWU"
    t_dhw_set:
      name: "Zadana temperatura CWU (odczyt)"
    max_t_set:
      name: "Max temperatura CO (odczyt)"
    t_dhw_set_ub:
      name: "Zakres CWU – max"
    t_dhw_set_lb:
      name: "Zakres CWU – min"
    max_t_set_ub:
      name: "Zakres max CO – max"
    max_t_set_lb:
      name: "Zakres max CO – min"
    otc_hc_ratio_ub:
      name: "Krzywa grzewcza – max"
    otc_hc_ratio_lb:
      name: "Krzywa grzewcza – min"
    opentherm_version_device:
      name: "Wersja OpenTherm kotła"
    device_type:
      name: "Typ urządzenia"
    device_version:
      name: "Wersja urządzenia"
    device_id:
      name: "ID producenta (MemberID)"

binary_sensor:
  - platform: opentherm
    # stan pracy
    flame_on:
      name: "Płomień"
    ch_active:
      name: "Grzanie CO aktywne"
    dhw_active:
      name: "Grzanie CWU aktywne"
    fault_indication:
      name: "Awaria"
    diagnostic_indication:
      name: "Komunikat serwisowy"
    cooling_active:
      name: "Chłodzenie aktywne"
    ch2_active:
      name: "Obieg 2 aktywny"
    electricity_production:
      name: "Produkcja prądu"
    # konfiguracja kotła (co obsługuje i co da się zapisywać)
    dhw_present:
      name: "Ma CWU"
    control_type_on_off:
      name: "Sterowanie tylko włącz-wyłącz"
    cooling_supported:
      name: "Obsługuje chłodzenie"
    dhw_storage_tank:
      name: "CWU z zasobnika"
    controller_pump_control_allowed:
      name: "Sterowanie pompą dozwolone"
    ch2_present:
      name: "Ma obieg 2"
    water_filling:
      name: "Napełnianie wody"
    heat_mode:
      name: "Tryb grzania"
    dhw_setpoint_transfer_enabled:
      name: "Zadana CWU – transfer dostępny"
    max_ch_setpoint_transfer_enabled:
      name: "Max CO – transfer dostępny"
    dhw_setpoint_rw:
      name: "Zadana CWU – można zapisywać"
    max_ch_setpoint_rw:
      name: "Max CO – można zapisywać"
    # błędy
    service_request:
      name: "Wymagany serwis"
    lockout_reset:
      name: "Blokada – wymaga resetu"
    low_water_pressure:
      name: "Niskie ciśnienie wody"
    flame_fault:
      name: "Błąd płomienia"
    air_pressure_fault:
      name: "Błąd ciśnienia powietrza"
    water_over_temp:
      name: "Przegrzanie wody"
