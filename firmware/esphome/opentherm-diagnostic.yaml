# OpenTherm – DIAGNOSTIC config (full OpenTherm read-out)
# First test with a new boiler. Prepared for the ACV ILEA (boilers/acv-ilea/), works with any OpenTherm boiler.
# ESP32-WROOM + OpenTherm adapter: GPIO21 = RX (input), GPIO22 = TX (output)
#
# Safe settings for the test:
#  - Central heating starts OFF (turn it on by hand in Home Assistant)
#  - Domestic hot water stays ON (hot water at the tap keeps working)
#  - Only the CH flow setpoint is written (default 40 °C);
#    the DHW setpoint and max CH setpoint are READ only, nothing overwrites them.

substitutions:
  name: opentherm-boiler          # same name as the target config → replaced over OTA
  friendly_name: Boiler

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

logger:
  level: DEBUG          # the logs show the boiler's response type for every message

api:                  # secrets: see secrets.example.yaml
  encryption:
    key: !secret api_key
  reboot_timeout: 0s    # no reboots when HA does not respond

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                   # fallback hotspot when Wi-Fi fails (network selection page)
    ssid: "${name}"
    password: !secret ap_password

captive_portal:

opentherm:
  in_pin: GPIO21
  out_pin: GPIO22

# ---------- CONTROL ----------
switch:
  - platform: opentherm
    ch_enable:
      name: "Central heating"
      restore_mode: ALWAYS_OFF
    dhw_enable:
      name: "Domestic hot water"
      restore_mode: ALWAYS_ON

number:
  - platform: opentherm
    t_set:
      name: "CH flow setpoint"
      min_value: 20
      max_value: 60
      step: 0.5
      initial_value: 40
      restore_value: true

# ---------- READINGS ----------
sensor:
  - platform: opentherm
    t_boiler:
      name: "Flow temperature"
    t_ret:
      name: "Return temperature"
    t_dhw:
      name: "DHW temperature"
    t_outside:
      name: "Outdoor temperature (boiler)"
    t_exhaust:
      name: "Flue gas temperature"
    t_flow_ch2:
      name: "Flow temperature circuit 2"
    t_dhw2:
      name: "DHW temperature 2"
    t_storage:
      name: "Solar storage temperature"
    t_collector:
      name: "Solar collector temperature"
    ch_pressure:
      name: "System pressure"
    dhw_flow_rate:
      name: "DHW flow rate"
    rel_mod_level:
      name: "Burner modulation"
    fan_speed:
      name: "Fan speed"
    fan_speed_setpoint:
      name: "Fan speed setpoint"
    flame_current:
      name: "Flame current"
    burner_starts:
      name: "Burner starts"
    ch_pump_starts:
      name: "CH pump starts"
    dhw_pump_valve_starts:
      name: "DHW pump or valve starts"
    dhw_burner_starts:
      name: "DHW burner starts"
    burner_operation_hours:
      name: "Burner operation hours"
    ch_pump_operation_hours:
      name: "CH pump operation hours"
    dhw_pump_valve_operation_hours:
      name: "DHW pump or valve operation hours"
    dhw_burner_operation_hours:
      name: "DHW burner operation hours"
    t_dhw_set:
      name: "DHW setpoint (read)"
    max_t_set:
      name: "Max CH setpoint (read)"
    t_dhw_set_ub:
      name: "DHW setpoint range – max"
    t_dhw_set_lb:
      name: "DHW setpoint range – min"
    max_t_set_ub:
      name: "Max CH setpoint range – max"
    max_t_set_lb:
      name: "Max CH setpoint range – min"
    otc_hc_ratio_ub:
      name: "Heating curve ratio – max"
    otc_hc_ratio_lb:
      name: "Heating curve ratio – min"
    opentherm_version_device:
      name: "Boiler OpenTherm version"
    device_type:
      name: "Device type"
    device_version:
      name: "Device version"
    device_id:
      name: "Manufacturer ID (MemberID)"

binary_sensor:
  - platform: opentherm
    # operating state
    flame_on:
      name: "Flame"
    ch_active:
      name: "Central heating active"
    dhw_active:
      name: "Hot water active"
    fault_indication:
      name: "Fault"
    diagnostic_indication:
      name: "Diagnostic indication"
    cooling_active:
      name: "Cooling active"
    ch2_active:
      name: "Circuit 2 active"
    electricity_production:
      name: "Electricity production"
    # boiler configuration (what it supports and what can be written)
    dhw_present:
      name: "Has DHW"
    control_type_on_off:
      name: "On/off control only"
    cooling_supported:
      name: "Supports cooling"
    dhw_storage_tank:
      name: "DHW storage tank"
    controller_pump_control_allowed:
      name: "Pump control allowed"
    ch2_present:
      name: "Has circuit 2"
    water_filling:
      name: "Water filling"
    heat_mode:
      name: "Heat mode"
    dhw_setpoint_transfer_enabled:
      name: "DHW setpoint – transfer enabled"
    max_ch_setpoint_transfer_enabled:
      name: "Max CH setpoint – transfer enabled"
    dhw_setpoint_rw:
      name: "DHW setpoint – writable"
    max_ch_setpoint_rw:
      name: "Max CH setpoint – writable"
    # faults
    service_request:
      name: "Service required"
    lockout_reset:
      name: "Lockout – reset required"
    low_water_pressure:
      name: "Low water pressure"
    flame_fault:
      name: "Flame fault"
    air_pressure_fault:
      name: "Air pressure fault"
    water_over_temp:
      name: "Water overtemperature"
