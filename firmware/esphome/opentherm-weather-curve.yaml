# OpenTherm – TARGET config: weather curve + room correction
# ESP32-WROOM + OpenTherm adapter: GPIO21 = RX (input), GPIO22 = TX (output)
#
# Flash ONLY after testing with the diagnostic config (opentherm-diagnostic.yaml) and the scan.
# Same device name (${name}), so it replaces the diagnostic config over OTA.
#
# How it works (details: README.md and docs/control-plan.html):
#  - HA decides how warm the house should be (target temperature of the ${target_climate} thermostat)
#    and whether heating is allowed (switch "Central heating" = heater of a generic_thermostat, safety cut-off).
#  - Every 30 s the ESP calculates the flow temperature:
#      curve      = target + slope × (target − outdoor) + offset
#      correction = P × (target − room) + I (slow integral, ±5 K)
#    and sends it to the boiler (TSet, ID 1), clamped to min/max and to the boiler's max CH setpoint (ID 57, read only).
#  - CH stays enabled for the whole heating season. The ESP turns it off by itself only when:
#      outdoor ≥ summer threshold (back on 1 °C lower),
#      room ≥ target + 1 °C for 15 min (back on at ≤ target + 0.5 °C).
#  - Without HA: the ESP does not reboot (reboot_timeout: 0s). After 10 min without HA it heats on the curve
#    with the last target and last outdoor temperature (then the boiler's, or 0 °C), without room correction.
#
# Safety rules (README.md): only TSet (ID 1) is written, within 20–60 °C.
# Max CH setpoint (ID 57) and DHW setpoint (ID 56) are read only.
#
# Before the first run: read the CH setting from the boiler panel and set "Curve offset"
# so that "Curve flow temperature" gives about the same in today's weather.
#
# Secrets: wifi_ssid, wifi_password, api_key, ota_password, ap_password (see secrets.example.yaml).
# Set the HA entities in substitutions below.
# Remove sensors your boiler does not support (scan result) so they don't clutter the bus.

substitutions:
  name: opentherm-boiler
  friendly_name: Boiler
  outdoor_sensor: sensor.outdoor_temperature     # outdoor temperature
  room_sensor: sensor.living_room_temperature    # reference room temperature
  target_climate: climate.heating                # HA thermostat; its temperature attribute (target) is used

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s          # by default the ESP reboots after 15 min without HA – not here

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}"
    password: !secret ap_password

captive_portal:

opentherm:
  in_pin: GPIO21
  out_pin: GPIO22

# ---------- INTERNAL STATE ----------
globals:
  - id: g_target                # last known target from the HA thermostat
    type: float
    restore_value: true
    initial_value: "21.0"
  - id: g_integral              # I term of the room correction [K]
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: g_last_tset             # last sent TSet (for the rise limit)
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_out_ms                # when the last outdoor temperature arrived from HA
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_api_lost_ms           # since when HA is disconnected (0 = connected)
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_over_since            # since when the room is too warm
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_overheat
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_summer
    type: bool
    restore_value: false
    initial_value: "false"

# ---------- CONTROL FROM HA ----------
switch:
  # HA turns this on and off (heater of generic_thermostat). After a restart the ESP restores the last state, ON by default.
  - platform: template
    id: sw_ch_ha
    name: "Central heating"
    icon: mdi:radiator
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: { id: regulate, tick: false }
    on_turn_off:
      - script.execute: { id: regulate, tick: false }

  # OFF = flow from "Manual flow temperature" instead of the curve (for tests and emergencies).
  - platform: template
    id: sw_curve
    name: "Weather curve"
    icon: mdi:chart-bell-curve-cumulative
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: { id: regulate, tick: false }
    on_turn_off:
      - script.execute: { id: regulate, tick: false }

  # OpenTherm bits – set only by the ESP logic.
  - platform: opentherm
    ch_enable:
      id: ot_ch_enable
      internal: true
      restore_mode: ALWAYS_OFF
    dhw_enable:
      id: ot_dhw_enable
      name: "Domestic hot water"
      restore_mode: ALWAYS_ON

button:
  - platform: template
    name: "Reset I correction"
    icon: mdi:restore
    entity_category: config
    on_press:
      - lambda: 'id(g_integral) = 0.0f;'
      - script.execute: { id: regulate, tick: false }

number:
  # TSet sent to the boiler – set only by the ESP logic.
  - platform: opentherm
    t_set:
      id: ot_t_set
      internal: true
      min_value: 20
      max_value: 60
      step: 0.1
      initial_value: 40
      restore_value: false

  # Curve tuning (from HA, stored on the ESP)
  - platform: template
    id: n_slope
    name: "Curve slope"
    icon: mdi:slope-uphill
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1.2
    min_value: 0.4
    max_value: 3.0
    step: 0.05
    mode: box
  - platform: template
    id: n_offset
    name: "Curve offset"
    icon: mdi:arrow-up-down
    entity_category: config
    unit_of_measurement: "K"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -10
    max_value: 10
    step: 0.5
    mode: box
  - platform: template
    id: n_kp
    name: "Room correction P"
    icon: mdi:home-thermometer
    entity_category: config
    unit_of_measurement: "K/K"
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 0
    max_value: 8
    step: 0.5
    mode: box
  - platform: template
    id: n_ki
    name: "Room correction I"
    icon: mdi:home-thermometer-outline
    entity_category: config
    unit_of_measurement: "K/h"
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0
    max_value: 5
    step: 0.1
    mode: box
  - platform: template
    id: n_tmin
    name: "Flow temperature minimum"
    icon: mdi:thermometer-low
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 25
    min_value: 20
    max_value: 50
    step: 0.5
    mode: box
  - platform: template
    id: n_tmax
    name: "Flow temperature maximum"
    icon: mdi:thermometer-high
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 55
    min_value: 30
    max_value: 60
    step: 0.5
    mode: box
  - platform: template
    id: n_rise
    name: "Flow temperature max rise"
    icon: mdi:trending-up
    entity_category: config
    unit_of_measurement: "K/min"
    optimistic: true
    restore_value: true
    initial_value: 0.5
    min_value: 0.1
    max_value: 5
    step: 0.1
    mode: box
  - platform: template
    id: n_summer
    name: "Summer threshold"
    icon: mdi:weather-sunny
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 16
    min_value: 10
    max_value: 22
    step: 0.5
    mode: box
  - platform: template
    id: n_manual
    name: "Manual flow temperature"
    icon: mdi:hand-back-right
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 20
    max_value: 60
    step: 0.5
    mode: box

# ---------- CONTROL LOOP ----------
script:
  - id: regulate
    mode: queued
    parameters:
      tick: bool                # true = called from the interval (integral runs)
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t MIN = 60UL * 1000UL;

          // connection to HA
          const bool api_ok = api::global_api_server != nullptr && api::global_api_server->is_connected();
          if (api_ok) {
            id(g_api_lost_ms) = 0;
          } else if (id(g_api_lost_ms) == 0) {
            id(g_api_lost_ms) = now ? now : 1;
          }
          const bool ha_lost_long = !api_ok && (now - id(g_api_lost_ms)) > 10 * MIN;

          // target temperature (last known)
          const float target = id(g_target);

          // outdoor temperature: HA → (after 3 h without HA) boiler ID 27 → 0 °C
          float tout = id(ha_outdoor).state;
          const char *tout_src = "HA";
          const bool out_stale = id(g_out_ms) == 0 || (!api_ok && (now - id(g_out_ms)) > 180 * MIN);
          if (std::isnan(tout) || out_stale) {
            const float t_ot = id(ot_t_outside).state;
            if (!std::isnan(t_ot) && t_ot > -40.0f && t_ot < 50.0f) {
              tout = t_ot;
              tout_src = "boiler";
            } else {
              tout = 0.0f;
              tout_src = "default 0 °C";
            }
          }

          // room (only while HA is connected)
          const float room = id(ha_room).state;
          const bool room_ok = api_ok && !std::isnan(room);
          const float err = room_ok ? (target - room) : 0.0f;

          // summer threshold with 1 K hysteresis
          const float summer = id(n_summer).state;
          if (tout >= summer) id(g_summer) = true;
          else if (tout <= summer - 1.0f) id(g_summer) = false;

          // room overheat: ≥ target + 1 K for 15 min, ends at ≤ target + 0.5 K
          if (room_ok && room >= target + 1.0f) {
            if (id(g_over_since) == 0) id(g_over_since) = now ? now : 1;
            if ((now - id(g_over_since)) > 15 * MIN) id(g_overheat) = true;
          } else {
            id(g_over_since) = 0;
            if (!room_ok || room <= target + 0.5f) id(g_overheat) = false;
          }

          // should CH run
          const bool allowed = id(sw_ch_ha).state || ha_lost_long;
          const bool want = allowed && !id(g_summer) && !id(g_overheat);

          // I term: only while CH runs, with room data, once per interval (30 s)
          if (tick && want && room_ok && id(sw_curve).state) {
            id(g_integral) += id(n_ki).state * err * (30.0f / 3600.0f);
            id(g_integral) = std::max(-5.0f, std::min(5.0f, id(g_integral)));
          }

          // curve + correction
          const float curve = target + id(n_slope).state * (target - tout) + id(n_offset).state;
          const float corr = room_ok ? (id(n_kp).state * err + id(g_integral)) : 0.0f;

          // limits: 20–60, min/max from HA, max CH read from the boiler (ID 57)
          float hard_max = 60.0f;
          const float boiler_max = id(ot_max_t_set).state;
          if (!std::isnan(boiler_max) && boiler_max >= 20.0f && boiler_max < hard_max) hard_max = boiler_max;
          const float tmax = std::min(id(n_tmax).state, hard_max);
          const float tmin = std::min(std::max(id(n_tmin).state, 20.0f), tmax);

          float tset;
          if (id(sw_curve).state) {
            tset = std::max(tmin, std::min(tmax, curve + corr));
            // gentle rise (e.g. in the morning after a night setback); drop immediately
            const float last = id(g_last_tset);
            if (tick && !std::isnan(last) && tset > last) {
              tset = std::min(tset, last + id(n_rise).state * 0.5f);
            } else if (!tick && !std::isnan(last) && tset > last) {
              tset = last;   // rise only at the interval pace
            }
          } else {
            tset = std::max(20.0f, std::min(hard_max, id(n_manual).state));
          }
          id(g_last_tset) = tset;

          // send to the boiler
          if (std::isnan(id(ot_t_set).state) || std::fabs(id(ot_t_set).state - tset) >= 0.05f) {
            auto call = id(ot_t_set).make_call();
            call.set_value(tset);
            call.perform();
          }
          if (want && !id(ot_ch_enable).state) id(ot_ch_enable).turn_on();
          if (!want && id(ot_ch_enable).state) id(ot_ch_enable).turn_off();

          // status for HA
          id(s_curve).publish_state(std::max(tmin, std::min(tmax, curve + corr)));
          id(s_tset).publish_state(tset);
          id(s_corr).publish_state(corr);
          id(s_integral).publish_state(id(g_integral));
          id(s_tout_used).publish_state(tout);

          std::string mode;
          if (id(g_summer)) mode = "Summer – CH off";
          else if (id(g_overheat)) mode = "Room too warm – CH off";
          else if (!allowed) mode = "Off from HA";
          else if (ha_lost_long) mode = "No HA – curve without correction";
          else if (!id(sw_curve).state) mode = "Manual";
          else if (!room_ok) mode = "Curve without room correction";
          else mode = "Curve + correction";
          if (id(t_mode).state != mode) id(t_mode).publish_state(mode);
          const std::string src = tout_src;
          if (id(t_tout_src).state != src) id(t_tout_src).publish_state(src);

interval:
  - interval: 30s
    then:
      - script.execute: { id: regulate, tick: true }

# ---------- READINGS ----------
sensor:
  # from Home Assistant
  - platform: homeassistant
    id: ha_outdoor
    entity_id: ${outdoor_sensor}
    internal: true
    on_value:
      - lambda: |-
          if (!std::isnan(x)) id(g_out_ms) = millis() ? millis() : 1;
  - platform: homeassistant
    id: ha_room
    entity_id: ${room_sensor}
    internal: true
  - platform: homeassistant
    id: ha_target
    entity_id: ${target_climate}
    attribute: temperature
    internal: true
    on_value:
      - lambda: |-
          if (!std::isnan(x) && x >= 5.0f && x <= 30.0f) id(g_target) = x;
      - script.execute: { id: regulate, tick: false }

  # control loop outputs
  - platform: template
    id: s_tset
    name: "Flow setpoint (sent)"
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: s_curve
    name: "Curve flow temperature"
    icon: mdi:chart-bell-curve-cumulative
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: s_corr
    name: "Room correction"
    icon: mdi:home-thermometer
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: s_integral
    name: "Room correction – I term"
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
  - platform: template
    id: s_tout_used
    name: "Outdoor temperature used"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic

  # from the boiler (OpenTherm)
  - platform: opentherm
    t_boiler:
      name: "Flow temperature"
    t_ret:
      name: "Return temperature"
    t_dhw:
      name: "DHW temperature"
    t_outside:
      id: ot_t_outside
      name: "Outdoor temperature (boiler)"
    ch_pressure:
      name: "System pressure"
    rel_mod_level:
      name: "Burner modulation"
    flame_current:
      name: "Flame current"
    burner_starts:
      name: "Burner starts"
      state_class: total_increasing
    dhw_burner_starts:
      name: "DHW burner starts"
      state_class: total_increasing
    burner_operation_hours:
      name: "Burner operation hours"
      state_class: total_increasing
    dhw_burner_operation_hours:
      name: "DHW burner operation hours"
      state_class: total_increasing
    max_t_set:
      id: ot_max_t_set
      name: "Max CH setpoint (read)"
      entity_category: diagnostic
    t_dhw_set:
      name: "DHW setpoint (read)"
      entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: t_mode
    name: "Control mode"
    icon: mdi:state-machine
  - platform: template
    id: t_tout_src
    name: "Outdoor temperature source"
    entity_category: diagnostic

binary_sensor:
  - platform: opentherm
    flame_on:
      name: "Flame"
    ch_active:
      name: "Central heating active"
    dhw_active:
      name: "Hot water active"
    fault_indication:
      name: "Fault"
    diagnostic_indication:
      name: "Diagnostic indication"
    service_request:
      name: "Service required"
    lockout_reset:
      name: "Lockout – reset required"
    low_water_pressure:
      name: "Low water pressure"
    flame_fault:
      name: "Flame fault"
    air_pressure_fault:
      name: "Air pressure fault"
    water_over_temp:
      name: "Water overtemperature"
  - platform: status
    name: "Connection"
