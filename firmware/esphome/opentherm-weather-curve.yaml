# OpenTherm – konfiguracja DOCELOWA: krzywa pogodowa + korekta pokojowa
# ESP32-WROOM + adapter OpenTherm: GPIO21 = RX (wejście), GPIO22 = TX (wyjście)
#
# Wgrywać DOPIERO po teście konfiguracją diagnostyczną (opentherm-diagnostic.yaml) i skanie.
# Ta sama nazwa urządzenia (${name}), więc zastępuje diagnostykę przez OTA.
#
# Jak działa (szczegóły: README.md i docs/control-plan.html):
#  - HA decyduje, ile ma być w domu (temperatura zadana termostatu ${target_climate})
#    i czy wolno grzać (switch „Grzanie CO” = heater generic_thermostat, wyłącznik bezpieczeństwa).
#  - ESP co 30 s liczy temperaturę zasilania:
#      krzywa = zadana + nachylenie × (zadana − zewnątrz) + przesunięcie
#      korekta = P × (zadana − pokój) + I (powolna całka, ±5 K)
#    i wysyła ją do kotła (TSet, ID 1), przyciętą do min/max i do max CO kotła (ID 57, tylko odczyt).
#  - CO jest włączone przez cały okres grzania. ESP wyłącza je sam tylko, gdy:
#      na zewnątrz ≥ próg lato (powrót 1 °C niżej),
#      pokój ≥ zadana + 1 °C przez 15 min (powrót przy ≤ zadana + 0,5 °C).
#  - Bez HA: ESP się nie restartuje (reboot_timeout: 0s). Po 10 min bez HA grzeje po krzywej
#    z ostatnią zadaną i ostatnią temperaturą zewnętrzną (potem z kotła albo 0 °C), bez korekty pokojowej.
#
# Zasady bezpieczeństwa (README.md): zapisywane jest tylko TSet (ID 1) w zakresie 20–60 °C.
# Max CO (ID 57) i zadana CWU (ID 56) są tylko odczytywane.
#
# Przed pierwszym uruchomieniem: odczytaj nastawę CO z panelu kotła i ustaw „Przesunięcie krzywej”
# tak, żeby „Zasilanie z krzywej” przy dzisiejszej pogodzie dawało mniej więcej tyle samo.
#
# Sekrety: wifi_ssid, wifi_password, api_key, ota_password, ap_password (zobacz secrets.example.yaml).
# Encje HA ustawiasz w substitutions poniżej.
# Sensory, których Twój kocioł nie obsługuje (wynik skanu), usuń, żeby nie zaśmiecały magistrali.

substitutions:
  name: opentherm-boiler
  friendly_name: Kocioł
  outdoor_sensor: sensor.outdoor_temperature     # temperatura na zewnątrz
  room_sensor: sensor.living_room_temperature    # temperatura w pokoju odniesienia
  target_climate: climate.heating                # termostat HA; bierzemy atrybut temperature (zadana)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s          # domyślnie ESP restartuje się po 15 min bez HA – tu nie wolno

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}"
    password: !secret ap_password

captive_portal:

opentherm:
  in_pin: GPIO21
  out_pin: GPIO22

# ---------- STAN WEWNĘTRZNY ----------
globals:
  - id: g_target                # ostatnia znana zadana z termostatu HA
    type: float
    restore_value: true
    initial_value: "21.0"
  - id: g_integral              # człon I korekty pokojowej [K]
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: g_last_tset             # ostatnio wysłane TSet (do ograniczenia narastania)
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: g_out_ms                # kiedy przyszła ostatnia temperatura zewnętrzna z HA
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_api_lost_ms           # od kiedy brak połączenia z HA (0 = jest połączenie)
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_over_since            # od kiedy pokój jest za ciepły
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: g_overheat
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_summer
    type: bool
    restore_value: false
    initial_value: "false"

# ---------- STEROWANIE Z HA ----------
switch:
  # To włącza i wyłącza HA (heater generic_thermostat). Po restarcie ESP wraca do ostatniego stanu, domyślnie WŁ.
  - platform: template
    id: sw_ch_ha
    name: "Grzanie CO"
    icon: mdi:radiator
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: { id: regulate, tick: false }
    on_turn_off:
      - script.execute: { id: regulate, tick: false }

  # WYŁ. = zasilanie z „Zasilanie ręczne” zamiast z krzywej (do testów i awaryjnie).
  - platform: template
    id: sw_curve
    name: "Krzywa pogodowa"
    icon: mdi:chart-bell-curve-cumulative
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: { id: regulate, tick: false }
    on_turn_off:
      - script.execute: { id: regulate, tick: false }

  # Bity OpenTherm – ustawia je tylko logika ESP.
  - platform: opentherm
    ch_enable:
      id: ot_ch_enable
      internal: true
      restore_mode: ALWAYS_OFF
    dhw_enable:
      id: ot_dhw_enable
      name: "Grzanie CWU"
      restore_mode: ALWAYS_ON

button:
  - platform: template
    name: "Zeruj korektę I"
    icon: mdi:restore
    entity_category: config
    on_press:
      - lambda: 'id(g_integral) = 0.0f;'
      - script.execute: { id: regulate, tick: false }

number:
  # TSet wysyłane do kotła – ustawia je tylko logika ESP.
  - platform: opentherm
    t_set:
      id: ot_t_set
      internal: true
      min_value: 20
      max_value: 60
      step: 0.1
      initial_value: 40
      restore_value: false

  # Strojenie krzywej (z HA, zapamiętywane w ESP)
  - platform: template
    id: n_slope
    name: "Nachylenie krzywej"
    icon: mdi:slope-uphill
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1.2
    min_value: 0.4
    max_value: 3.0
    step: 0.05
    mode: box
  - platform: template
    id: n_offset
    name: "Przesunięcie krzywej"
    icon: mdi:arrow-up-down
    entity_category: config
    unit_of_measurement: "K"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -10
    max_value: 10
    step: 0.5
    mode: box
  - platform: template
    id: n_kp
    name: "Korekta pokojowa P"
    icon: mdi:home-thermometer
    entity_category: config
    unit_of_measurement: "K/K"
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 0
    max_value: 8
    step: 0.5
    mode: box
  - platform: template
    id: n_ki
    name: "Korekta pokojowa I"
    icon: mdi:home-thermometer-outline
    entity_category: config
    unit_of_measurement: "K/h"
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0
    max_value: 5
    step: 0.1
    mode: box
  - platform: template
    id: n_tmin
    name: "Zasilanie minimum"
    icon: mdi:thermometer-low
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 25
    min_value: 20
    max_value: 50
    step: 0.5
    mode: box
  - platform: template
    id: n_tmax
    name: "Zasilanie maksimum"
    icon: mdi:thermometer-high
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 55
    min_value: 30
    max_value: 60
    step: 0.5
    mode: box
  - platform: template
    id: n_rise
    name: "Narastanie zasilania max"
    icon: mdi:trending-up
    entity_category: config
    unit_of_measurement: "K/min"
    optimistic: true
    restore_value: true
    initial_value: 0.5
    min_value: 0.1
    max_value: 5
    step: 0.1
    mode: box
  - platform: template
    id: n_summer
    name: "Próg lato"
    icon: mdi:weather-sunny
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 16
    min_value: 10
    max_value: 22
    step: 0.5
    mode: box
  - platform: template
    id: n_manual
    name: "Zasilanie ręczne"
    icon: mdi:hand-back-right
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 20
    max_value: 60
    step: 0.5
    mode: box

# ---------- REGULACJA ----------
script:
  - id: regulate
    mode: queued
    parameters:
      tick: bool                # true = wywołanie z interwału (liczy się całka)
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t MIN = 60UL * 1000UL;

          // połączenie z HA
          const bool api_ok = api::global_api_server != nullptr && api::global_api_server->is_connected();
          if (api_ok) {
            id(g_api_lost_ms) = 0;
          } else if (id(g_api_lost_ms) == 0) {
            id(g_api_lost_ms) = now ? now : 1;
          }
          const bool ha_lost_long = !api_ok && (now - id(g_api_lost_ms)) > 10 * MIN;

          // temperatura zadana (ostatnia znana)
          const float target = id(g_target);

          // temperatura zewnętrzna: HA → (po 3 h bez HA) kocioł ID 27 → 0 °C
          float tout = id(ha_outdoor).state;
          const char *tout_src = "HA";
          const bool out_stale = id(g_out_ms) == 0 || (!api_ok && (now - id(g_out_ms)) > 180 * MIN);
          if (std::isnan(tout) || out_stale) {
            const float t_ot = id(ot_t_outside).state;
            if (!std::isnan(t_ot) && t_ot > -40.0f && t_ot < 50.0f) {
              tout = t_ot;
              tout_src = "kocioł";
            } else {
              tout = 0.0f;
              tout_src = "domyślna 0 °C";
            }
          }

          // pokój (tylko gdy HA jest połączony)
          const float room = id(ha_room).state;
          const bool room_ok = api_ok && !std::isnan(room);
          const float err = room_ok ? (target - room) : 0.0f;

          // próg lato z histerezą 1 K
          const float summer = id(n_summer).state;
          if (tout >= summer) id(g_summer) = true;
          else if (tout <= summer - 1.0f) id(g_summer) = false;

          // przegrzanie pokoju: ≥ zadana + 1 K przez 15 min, koniec przy ≤ zadana + 0,5 K
          if (room_ok && room >= target + 1.0f) {
            if (id(g_over_since) == 0) id(g_over_since) = now ? now : 1;
            if ((now - id(g_over_since)) > 15 * MIN) id(g_overheat) = true;
          } else {
            id(g_over_since) = 0;
            if (!room_ok || room <= target + 0.5f) id(g_overheat) = false;
          }

          // czy grzać CO
          const bool allowed = id(sw_ch_ha).state || ha_lost_long;
          const bool want = allowed && !id(g_summer) && !id(g_overheat);

          // człon I: tylko przy pracy CO, z danymi z pokoju, raz na interwał (30 s)
          if (tick && want && room_ok && id(sw_curve).state) {
            id(g_integral) += id(n_ki).state * err * (30.0f / 3600.0f);
            id(g_integral) = std::max(-5.0f, std::min(5.0f, id(g_integral)));
          }

          // krzywa + korekta
          const float curve = target + id(n_slope).state * (target - tout) + id(n_offset).state;
          const float corr = room_ok ? (id(n_kp).state * err + id(g_integral)) : 0.0f;

          // granice: 20–60, min/max z HA, max CO odczytane z kotła (ID 57)
          float hard_max = 60.0f;
          const float boiler_max = id(ot_max_t_set).state;
          if (!std::isnan(boiler_max) && boiler_max >= 20.0f && boiler_max < hard_max) hard_max = boiler_max;
          const float tmax = std::min(id(n_tmax).state, hard_max);
          const float tmin = std::min(std::max(id(n_tmin).state, 20.0f), tmax);

          float tset;
          if (id(sw_curve).state) {
            tset = std::max(tmin, std::min(tmax, curve + corr));
            // łagodne narastanie (np. rano po obniżce nocnej); spadek od razu
            const float last = id(g_last_tset);
            if (tick && !std::isnan(last) && tset > last) {
              tset = std::min(tset, last + id(n_rise).state * 0.5f);
            } else if (!tick && !std::isnan(last) && tset > last) {
              tset = last;   // wzrost tylko w rytmie interwału
            }
          } else {
            tset = std::max(20.0f, std::min(hard_max, id(n_manual).state));
          }
          id(g_last_tset) = tset;

          // wysłanie do kotła
          if (std::isnan(id(ot_t_set).state) || std::fabs(id(ot_t_set).state - tset) >= 0.05f) {
            auto call = id(ot_t_set).make_call();
            call.set_value(tset);
            call.perform();
          }
          if (want && !id(ot_ch_enable).state) id(ot_ch_enable).turn_on();
          if (!want && id(ot_ch_enable).state) id(ot_ch_enable).turn_off();

          // podgląd w HA
          id(s_curve).publish_state(std::max(tmin, std::min(tmax, curve + corr)));
          id(s_tset).publish_state(tset);
          id(s_corr).publish_state(corr);
          id(s_integral).publish_state(id(g_integral));
          id(s_tout_used).publish_state(tout);

          std::string mode;
          if (id(g_summer)) mode = "Lato – CO wyłączone";
          else if (id(g_overheat)) mode = "Pokój za ciepły – CO wyłączone";
          else if (!allowed) mode = "Wyłączone z HA";
          else if (ha_lost_long) mode = "Bez HA – krzywa bez korekty";
          else if (!id(sw_curve).state) mode = "Ręcznie";
          else if (!room_ok) mode = "Krzywa bez korekty pokojowej";
          else mode = "Krzywa + korekta";
          if (id(t_mode).state != mode) id(t_mode).publish_state(mode);
          const std::string src = tout_src;
          if (id(t_tout_src).state != src) id(t_tout_src).publish_state(src);

interval:
  - interval: 30s
    then:
      - script.execute: { id: regulate, tick: true }

# ---------- ODCZYTY ----------
sensor:
  # z Home Assistant
  - platform: homeassistant
    id: ha_outdoor
    entity_id: ${outdoor_sensor}
    internal: true
    on_value:
      - lambda: |-
          if (!std::isnan(x)) id(g_out_ms) = millis() ? millis() : 1;
  - platform: homeassistant
    id: ha_room
    entity_id: ${room_sensor}
    internal: true
  - platform: homeassistant
    id: ha_target
    entity_id: ${target_climate}
    attribute: temperature
    internal: true
    on_value:
      - lambda: |-
          if (!std::isnan(x) && x >= 5.0f && x <= 30.0f) id(g_target) = x;
      - script.execute: { id: regulate, tick: false }

  # wyniki regulacji
  - platform: template
    id: s_tset
    name: "Zasilanie zadane (wysłane)"
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: s_curve
    name: "Zasilanie z krzywej"
    icon: mdi:chart-bell-curve-cumulative
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: s_corr
    name: "Korekta pokojowa"
    icon: mdi:home-thermometer
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: s_integral
    name: "Korekta pokojowa – człon I"
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
  - platform: template
    id: s_tout_used
    name: "Temperatura zewnętrzna użyta"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic

  # z kotła (OpenTherm)
  - platform: opentherm
    t_boiler:
      name: "Temperatura zasilania"
    t_ret:
      name: "Temperatura powrotu"
    t_dhw:
      name: "Temperatura CWU"
    t_outside:
      id: ot_t_outside
      name: "Temperatura zewnętrzna (kocioł)"
    ch_pressure:
      name: "Ciśnienie instalacji"
    rel_mod_level:
      name: "Modulacja palnika"
    flame_current:
      name: "Prąd jonizacji"
    burner_starts:
      name: "Starty palnika"
      state_class: total_increasing
    dhw_burner_starts:
      name: "Starty palnika na CWU"
      state_class: total_increasing
    burner_operation_hours:
      name: "Godziny pracy palnika"
      state_class: total_increasing
    dhw_burner_operation_hours:
      name: "Godziny pracy palnika na CWU"
      state_class: total_increasing
    max_t_set:
      id: ot_max_t_set
      name: "Max temperatura CO (odczyt)"
      entity_category: diagnostic
    t_dhw_set:
      name: "Zadana temperatura CWU (odczyt)"
      entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi sygnał"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: t_mode
    name: "Tryb sterowania"
    icon: mdi:state-machine
  - platform: template
    id: t_tout_src
    name: "Źródło temperatury zewnętrznej"
    entity_category: diagnostic

binary_sensor:
  - platform: opentherm
    flame_on:
      name: "Płomień"
    ch_active:
      name: "Grzanie CO aktywne"
    dhw_active:
      name: "Grzanie CWU aktywne"
    fault_indication:
      name: "Awaria"
    diagnostic_indication:
      name: "Komunikat serwisowy"
    service_request:
      name: "Wymagany serwis"
    lockout_reset:
      name: "Blokada – wymaga resetu"
    low_water_pressure:
      name: "Niskie ciśnienie wody"
    flame_fault:
      name: "Błąd płomienia"
    air_pressure_fault:
      name: "Błąd ciśnienia powietrza"
    water_over_temp:
      name: "Przegrzanie wody"
  - platform: status
    name: "Połączenie"
